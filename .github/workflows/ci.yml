name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ────────────────────────────────────────────
  # 백엔드 CI: lint → 타입 체크 → 테스트 → 빌드
  # ────────────────────────────────────────────
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: pnpm 설치
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: pnpm 캐시 설정
        uses: actions/cache@v4
        with:
          path: backend/node_modules
          key: backend-${{ runner.os }}-${{ hashFiles('backend/pnpm-lock.yaml') }}
          restore-keys: backend-${{ runner.os }}-

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: Prisma 클라이언트 생성
        run: npx prisma generate
        env:
          # prisma generate는 DB 연결이 필요 없지만 schema 파싱 시 env() 검증을 위해 더미값 사용
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Lint
        run: pnpm lint

      - name: 타입 체크
        run: npx tsc --noEmit

      - name: 단위 테스트
        run: pnpm test
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          AUTH_SECRET: ci-secret-for-test

      - name: 빌드
        run: pnpm build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

  # ────────────────────────────────────────────
  # 프론트엔드 CI: 타입 체크 → 빌드
  # ────────────────────────────────────────────
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: pnpm 설치
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: pnpm 캐시 설정
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: frontend-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: frontend-${{ runner.os }}-

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: Prisma 클라이언트 생성
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: 타입 체크
        run: npx tsc --noEmit

      - name: 빌드
        run: pnpm build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          AUTH_SECRET: ci-secret-for-build
          AUTH_GOOGLE_ID: ci-google-id
          AUTH_GOOGLE_SECRET: ci-google-secret
          API_URL: http://localhost:8000

  # ────────────────────────────────────────────
  # CD: Docker 이미지 빌드 → ECR 푸시 → ECS 배포
  # main 브랜치 push 시에만 실행 (PR 제외)
  # ────────────────────────────────────────────
  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push'
    permissions:
      id-token: write   # OIDC 토큰 요청에 필요
      contents: read

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: AWS 자격증명 설정 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: ECR 로그인
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 이미지 태그 설정
        run: echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_ENV

      - name: 모니터링 설정 파일 S3 업로드
        run: |
          aws s3 cp monitoring/prometheus/prometheus.prod.yml \
            s3://talkertive-s3-bucket-857110241994-ap-northeast-2-an/monitoring/prometheus.prod.yml
          aws s3 cp monitoring/loki/loki-config.yml \
            s3://talkertive-s3-bucket-857110241994-ap-northeast-2-an/monitoring/loki-config.yml
          aws s3 sync monitoring/grafana/provisioning/ \
            s3://talkertive-s3-bucket-857110241994-ap-northeast-2-an/monitoring/grafana/provisioning/

      - name: 백엔드 이미지 빌드 & ECR 푸시
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build \
            --platform linux/amd64 \
            -t $ECR_REGISTRY/talkertive-backend:$IMAGE_TAG \
            -t $ECR_REGISTRY/talkertive-backend:latest \
            ./backend
          docker push $ECR_REGISTRY/talkertive-backend:$IMAGE_TAG
          docker push $ECR_REGISTRY/talkertive-backend:latest

      - name: 프론트엔드 이미지 빌드 & ECR 푸시
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build \
            --platform linux/amd64 \
            --build-arg NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }} \
            -t $ECR_REGISTRY/talkertive-frontend:$IMAGE_TAG \
            -t $ECR_REGISTRY/talkertive-frontend:latest \
            ./frontend
          docker push $ECR_REGISTRY/talkertive-frontend:$IMAGE_TAG
          docker push $ECR_REGISTRY/talkertive-frontend:latest

      - name: ECS 백엔드 배포
        run: |
          aws ecs update-service \
            --cluster talkertive-cluster \
            --service talkertive-backend-service \
            --force-new-deployment

      - name: ECS 프론트엔드 배포
        run: |
          aws ecs update-service \
            --cluster talkertive-cluster \
            --service talkertive-frontend-service \
            --force-new-deployment

      - name: 배포 완료 대기 (백엔드)
        run: |
          aws ecs wait services-stable \
            --cluster talkertive-cluster \
            --services talkertive-backend-service

      - name: 배포 완료 대기 (프론트엔드)
        run: |
          aws ecs wait services-stable \
            --cluster talkertive-cluster \
            --services talkertive-frontend-service
